# Deploys every push to main to Vercel production.
#
# The deployment runs under the Vercel account that owns the VERCEL_TOKEN
# repository secret (create one at https://vercel.com/account/tokens, then add
# it in GitHub: Settings → Secrets and variables → Actions → VERCEL_TOKEN).
# The org/project IDs below only identify the target project — they are not
# credentials; nothing deploys without the token.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels any in-flight deploy so main never deploys out of order.
concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_PcH5o9iZbQCA9kM84CtEZIVg
  VERCEL_PROJECT_ID: prj_KMf1VbIurjlkhZDWKkjk9UHQknRH

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uploads the source and builds on Vercel's servers — same behaviour as
      # running `vercel deploy --prod` locally.
      - name: Deploy to Vercel (production)
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
